name: morphing_code_scanner
description: A Flutter app to scan and decode Advanced Morphing Codes with AI-powered insights.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+5
  image: ^4.0.17
  image_picker: ^1.0.0
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  uuid: ^4.0.0
  fl_chart: ^0.65.0
  intl: ^0.19.0
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
